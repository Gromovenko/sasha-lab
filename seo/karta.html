<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Карточка машины — Дядя Саша</title>
<style>
 body{margin:0;background:#0e0f12;color:#e8e8ea;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
 h1{font-size:24px;margin:0 0 4px} .sub{color:#9a9aa2;margin:0 0 18px}
 .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
 select{box-sizing:border-box;background:#15171c;border:1px solid #2a2c33;border-radius:10px;color:#e8e8ea;padding:12px;font:inherit;min-width:0}
 input{box-sizing:border-box;background:#15171c;border:1px solid #2a2c33;border-radius:10px;color:#e8e8ea;padding:12px;font:inherit;min-width:0}
 #make,#model{flex:1 1 140px} #year{flex:0 0 120px} select:disabled{opacity:.5}
 button{border:0;border-radius:10px;font:600 16px/1 inherit;cursor:pointer;padding:12px 18px}
 .go{background:#f0b429;color:#191919} .mic{background:#1d2027;color:#e8e8ea;border:1px solid #2c3038}
 .mic.rec{background:#c0392b;border-color:#c0392b;color:#fff}
 .hint{color:#9a9aa2;font-size:14px;margin:4px 0 14px}
 .card{margin:18px 0;background:#15171c;border:1px solid #23252c;border-radius:14px;overflow:hidden}
 .head{padding:14px 16px;background:#1a1d23;border-bottom:1px solid #23252c}
 .head b{font-size:19px} .head span{color:#9a9aa2;font-size:14px;margin-left:8px}
 table{width:100%;border-collapse:collapse}
 td{padding:9px 16px;border-top:1px solid #1f2127;vertical-align:top;font-size:15px}
 tr:first-child td{border-top:0}
 td.n{width:30px;color:#6d6f78} td.l{width:36%;color:#b8b8c0}
 .yes{color:#5fd08a;font-weight:600} .no{color:#7b7d86} .warn{color:#f0b429}
 .src{font-size:13px;margin-top:2px;color:#9a9aa2}
 ul.lk{margin:4px 0 0;padding-left:18px;font-size:14px} ul.lk li{margin:2px 0;font-weight:400}
 a{color:#f0b429} .sm{color:#9a9aa2;font-size:13px}
 .msg{padding:14px;border-radius:12px;background:#15171c;border:1px solid #23252c}
 .err{color:#ff8a80}
 @media(max-width:560px){td.l{width:auto} td{padding:8px 10px}}
</style></head><body><div class="wrap">
<h1>Карточка машины</h1>
<p class="sub">Выберите марку, модель и год из списков или скажите голосом: например «Киа Селтос 2021».</p>

<div class="row">
  <select id="make"><option value="">Марка</option></select>
  <select id="model" disabled><option value="">Модель</option></select>
  <select id="year" disabled><option value="">Год</option></select>
</div>
<div class="row">
  <button class="go" id="go" type="button">Найти</button>
  <button class="mic" id="mic" type="button" aria-label="Голосовой ввод">🎤 Голос</button>
</div>
<div class="hint" id="hint"></div>
<div id="out"></div>
<p class="sm">Данные собраны из открытых источников. Показаны только пункты, по которым в базе есть данные. Факты ещё не все подтверждены мастером.</p>
</div>
<script>
(function(){
 var $=function(id){return document.getElementById(id);};
 var esc=function(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});};
 var rub=function(n){return n==null?'':Number(n).toLocaleString('ru-RU')+' ₽';};
 var host=function(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return 'источник';}};
 var link=function(u){return u?'<div class="src">Источник: <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(host(u))+'</a></div>':'';};

 var cap=function(w){w=String(w||'');return w.length<=3?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1);};
 function links(list){
  if(!list||!list.length) return '';
  return '<ul class="lk">'+list.map(function(l){return '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.title||l.host)+'</a> <span class="sm">· '+esc(l.host)+'</span></li>';}).join('')+'</ul>';
 }
 // карточка одна; строки только с данными, у каждой — список ссылок на источники
 function card(c,yr){
  var years=c.year_from?(c.year_from+'–'+(c.year_to||'н.в.')):'';
  var rows=c.items.map(function(i){
   return '<tr><td class="n">'+i.n+'</td><td class="l">'+esc(i.label)+'</td><td><b>'+esc(i.value)+'</b>'+links(i.links)+'</td></tr>';
  }).join('');
  var conf=c.confidence!=null?'<div class="sm">уверенность фактов до '+Math.round(c.confidence*100)+'%'+(c.confirmed?' · есть подтверждённые':'')+'</div>':'';
  var shop=c.shop&&c.shop.length?'<div class="sm">Разделы магазинов по этой модели:</div>'+links(c.shop):'';
  return '<div class="card"><div class="head"><b>'+esc(cap(c.make))+' '+esc(cap(c.model))+'</b>'+
   '<span>'+years+(yr?' · запрос: '+yr:'')+'</span>'+conf+shop+'</div>'+
   (rows?'<table>'+rows+'</table>':'<div class="msg">По этой машине пунктов с данными пока нет.</div>')+'</div>';
 }

 var busy=false, TREE=[];
 var BASE=/[\s-]+(?:[ivx]{1,4}|\d{1,2}|sp\d+|gen\d*|mk\d+)$/i;
 function fill(sel,items,ph){
  sel.innerHTML='<option value="">'+ph+'</option>'+items.map(function(i){return '<option value="'+esc(i.v)+'">'+esc(i.t)+'</option>';}).join('');
  sel.disabled=!items.length;
 }
 function models(){ var m=TREE.filter(function(x){return x.make===$('make').value;})[0]; return m?m.models:[]; }
 function onMake(){
  fill($('model'),models().map(function(m){return {v:m.model,t:cap(m.model)};}),'Модель');
  fill($('year'),[],'Год');
 }
 function onModel(){
  var m=models().filter(function(x){return x.model===$('model').value;})[0];
  fill($('year'),m?m.years.map(function(y){return {v:y,t:y};}):[],'Любой год');
  if(m) $('year').options[0].textContent='Любой год';
  if(m) search();
 }
 function search(q){
  if(busy) return;
  var qs=[];
  if(q) qs.push('q='+encodeURIComponent(q));
  else{
   if(!$('make').value||!$('model').value){ $('out').innerHTML='<div class="msg">Выберите марку и модель.</div>'; return; }
   ['make','model','year'].forEach(function(k){var v=$(k).value; if(v) qs.push(k+'='+encodeURIComponent(v));});
  }
  busy=true; $('out').innerHTML='<div class="msg">Ищу…</div>';
  fetch('/karta/api?'+qs.join('&')).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
   busy=false;
   if(!x.ok){ $('out').innerHTML='<div class="msg err">'+esc(x.j.error||'ошибка')+'</div>'; return; }
   var j=x.j;
   if(!j.found){ $('out').innerHTML='<div class="msg">Такой машины в базе нет. Выберите марку и модель из списков.</div>'; return; }
   if(q) syncSelects(j.cards[0],j.year);
   var head=j.yearMiss?'<div class="msg warn">Года '+j.year+' нет ни в одном из поколений — показаны все найденные.</div>':'';
   $('out').innerHTML=head+j.cards.map(function(c){return card(c,j.year);}).join('');
  }).catch(function(){busy=false;$('out').innerHTML='<div class="msg err">Нет связи с сервером.</div>';});
 }
 // после голоса выставляем списки по найденной машине
 function syncSelects(c,y){
  var mk=String(c.make).toLowerCase(), md=String(c.model).toLowerCase().replace(BASE,'').trim();
  if(!TREE.some(function(x){return x.make===mk;})) return;
  $('make').value=mk; onMake(); $('model').value=md;
  if($('model').value!==md) return;
  onModelNoSearch(); if(y) $('year').value=String(y);
 }
 function onModelNoSearch(){
  var m=models().filter(function(x){return x.model===$('model').value;})[0];
  fill($('year'),m?m.years.map(function(y){return {v:y,t:y};}):[],'Любой год');
 }
 $('make').onchange=onMake;
 $('model').onchange=onModel;
 $('year').onchange=function(){ if($('model').value) search(); };
 $('go').onclick=function(){ search(); };
 fetch('/karta/options').then(function(r){return r.json();}).then(function(j){
  TREE=j.makes||[];
  fill($('make'),TREE.map(function(m){return {v:m.make,t:cap(m.make)};}),'Марка');
  var p=new URLSearchParams(location.search);
  if(p.get('q')) search(p.get('q'));
 }).catch(function(){ $('hint').textContent='Не удалось загрузить список марок.'; });

 // ── голос ──
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 var rec=null, media=null, chunks=[], recording=false;
 function heard(text){
  $('hint').textContent='Услышано: «'+text+'»'; search(text);
 }
 function stopUi(){ recording=false; $('mic').classList.remove('rec'); $('mic').textContent='🎤 Голос'; }
 function viaBrowser(){
  if(recording&&rec){ rec.stop(); return; }
  rec=new SR(); rec.lang='ru-RU'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=function(e){ heard(e.results[0][0].transcript); };
  rec.onerror=function(e){ stopUi(); $('hint').textContent=e.error==='not-allowed'?'Нет доступа к микрофону — разрешите его в браузере.':'Не удалось распознать ('+e.error+'). Попробуйте ещё раз.'; };
  rec.onend=stopUi;
  recording=true; $('mic').classList.add('rec'); $('mic').textContent='■ Говорите…'; $('hint').textContent='';
  rec.start();
 }
 function viaServer(){
  if(recording&&media){ media.stop(); return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ $('hint').textContent='Браузер не умеет записывать голос. Введите текстом.'; return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
   chunks=[]; media=new MediaRecorder(stream);
   media.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
   media.onstop=function(){
    stream.getTracks().forEach(function(t){t.stop();}); stopUi(); $('hint').textContent='Распознаю…';
    var blob=new Blob(chunks,{type:media.mimeType||'audio/webm'});
    fetch('/karta/stt',{method:'POST',headers:{'Content-Type':blob.type},body:blob}).then(function(r){return r.json();}).then(function(j){
     if(j.text) heard(j.text); else $('hint').textContent=j.error||'Не расслышал, повторите.';
    }).catch(function(){ $('hint').textContent='Нет связи с сервером.'; });
   };
   recording=true; $('mic').classList.add('rec'); $('mic').textContent='■ Стоп'; $('hint').textContent='Говорите, затем нажмите «Стоп».';
   media.start(); setTimeout(function(){ if(recording&&media&&media.state==='recording') media.stop(); },15000);
  }).catch(function(){ $('hint').textContent='Нет доступа к микрофону — разрешите его в браузере.'; });
 }
 $('mic').onclick=function(){ SR?viaBrowser():viaServer(); };
})();
</script></body></html>
